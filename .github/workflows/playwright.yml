name: Playwright Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Run tests (${{ matrix.browser }})
        id: tests
        continue-on-error: true
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          pytest -n 1 --browser ${{ matrix.browser }}

      - name: Upload Allure Results (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results

      - name: Install Allure CLI
        if: always()
        run: |
          npm install -g allure-commandline

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure Report (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}
          path: allure-report

      - name: Configure GitHub Pages
        if: always() && matrix.browser == 'chromium'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: always() && matrix.browser == 'chromium'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        if: always() && matrix.browser == 'chromium'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Notify Slack
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR="good"
            STATUS="✅ PASSED"
          else
            COLOR="danger"
            STATUS="❌ FAILED"
          fi

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [{
              \"color\": \"$COLOR\",
              \"title\": \"Playwright Tests $STATUS\",
              \"text\": \"Repository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nReport: https://${{ github.repository_owner }}.github.io/E-commerce-playwright-pytest-framework/\"
            }]
          }" \
          ${{ secrets.SLACK_WEBHOOK }}